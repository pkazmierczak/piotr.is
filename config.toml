baseurl = "https://piotr.is/"
languageCode = "en-us"
title = "Piotr Kaźmierczak"
enableEmoji = true
footnotereturnlinkcontents = "↩"
pygmentsuseclasses = true
MetaDataFormat = "yaml"

[outputs]
    home = ["HTML", "RSS"]
    page = ["HTML"]

[outputFormats.RSS]
    path = "/feed/"

[permalinks]
    post = "/:year/:slug/"
    page = "/:title/"

[author]
    name = "Piotr Kaźmierczak"

[params]
    description = "A personal blog."
    author = "Piotr Kaźmierczak"
    copyright = "© 2009-2020 Piotr Kaźmierczak"
    highlight = true
    dark = "auto"

[markup.goldmark.renderer]
    unsafe= true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "posts"
    title = "posts"
    url = "/"
    weight = 10

  [[menu.main]]
    identifier = "about"
    name = "about"
    title = "about"
    url = "/about/"
    weight = 20


[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = false
    respectDoNotTrack = true
    useSessionStorage = true
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

