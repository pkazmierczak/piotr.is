{{ partial "header.html" . }}

<section id=content>
  <ul class=posts_listing>
    {{ range .Pages }}
      <li>
        {{ if .Title }}
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        {{ else }}
        <h2><a href="{{ .Permalink }}">[untitled]</a></h2>
        {{ end }}
        <div class=date>
          {{if not .Date.IsZero }}
            {{ .Date.Format (.Site.Params.dateform | default "January 2006") }}
          {{end}}
        </div>
      </li>
    {{ end }}
  </ul>
</section>

{{ partial "footer.html" . }}
