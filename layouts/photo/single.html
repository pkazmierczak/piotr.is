{{ partial "header.html" . }}

<section id=content>
  <div class="photo-content">
    <img src="{{ .Params.photo }}" />
    {{ $img := .Page.Resources.GetMatch .Params.photo}}
    {{ $img.Exif.Date }}
  </div>

  <div id=sub-header align="center">
    <span class="photo">{{ .Date.Format (.Site.Params.dateform | default "January 2006") }}&nbsp;&middot;&nbsp;{{ .Params.location }}
        </span>
    </div>

</section>

{{ partial "footer.html" . }}
