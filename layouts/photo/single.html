{{ define "main" }}
{{ $img := .Page.Resources.GetMatch .Params.photo}}
{{ $exif := $img.Exif.Tags }}
  <article class="photo">
    <section class="prose dark:prose-light photo">
      <a href="{{ .Params.photo }}"><img src="{{ .Params.photo }}" title="{{ $exif.Make }} {{ $exif.Model }}, {{ $exif.FocalLength }}mm, {{ $exif.ExposureTime }} sec., f/{{ $exif.FNumber }}, ISO {{ $exif.ISOSpeedRatings }}"/></a>
    </section>
      <div class="mt-8 mb-12 text-base text-neutral-400 dark:text-neutral-500">
        {{ with $img.Exif.Date }}{{ .Format "January 02, 2006" }}{{ end }}&nbsp;&middot;&nbsp;<a href="https://www.google.com/maps/search/{{ .Params.location | urlize }}">{{ .Params.location }}</a>
      </div>
    <footer class="pt-8">
      {{ partial "author.html" . }}
      {{ partial "sharing-links.html" . }}
    </footer>
  </article>
{{ end }}
