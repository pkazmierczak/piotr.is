{{ partial "header.html" . }}
{{ $img := .Page.Resources.GetMatch .Params.photo}}
{{ $exif := $img.Exif.Tags }}

<section id=content>
  <div class="photo-content">
    <img src="{{ .Params.photo }}" title="{{ $exif.Make }} {{ $exif.Model }}, {{ $exif.FocalLength }}mm, {{ $exif.ExposureTime }} sec., f/{{ $exif.FNumber }}, ISO {{ $exif.ISOSpeedRatings }}"/>
  </div>

  <div id=sub-header align="center">
    <span class="photo">{{ with $img.Exif.Date }}{{ .Format "January 02, 2006" }}{{ end }}&nbsp;&middot;&nbsp;<a href="https://www.google.com/maps/search/{{ .Params.location | urlize }}">{{ .Params.location }}</a></span>
  </div>

</section>

{{ partial "footer.html" . }}
