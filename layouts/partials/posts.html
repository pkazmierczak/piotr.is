<h3>Posts</h3>
{{- range where site.Pages "Section" "post" }}
{{ range .Pages.GroupByDate "2006" }}
<h4>{{ .Key }}</h4>
{{ range .Pages }}
<ul id="posts">
        {{ if .Title }}
    <li>
        <a href="{{ .Permalink }}">
            {{ .Title }}
            <small><time>{{ .Date.Format "Jan 2, 2006" }}</time></small>
        </a>
    </li>
    {{ end }}
</ul>
{{ end }}
{{ end }}
{{- end }}
