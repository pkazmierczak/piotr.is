    <div class="relative flex flex-col grow">
      <main id="main-content" class="grow">
{{ $images := where .Site.RegularPages "Section" "photo" }}
{{ range first 1 ($images.ByDate.Reverse) }}
  {{ $img := .Page.Resources.GetMatch .Params.photo }}
  {{ $exif := $img.Exif }}
  {{ $tags := $exif.Tags }}
  <article class="photo">
    <a href="{{ .Permalink }}">
      <section class="prose dark:prose-light photo">
        <img src="{{ .Page.RelPermalink }}{{ .Page.Params.photo }}"
             alt="{{ $tags.Make }} {{ $tags.Model }}, {{ $tags.FocalLength }}mm"
             title="{{ $tags.Make }} {{ $tags.Model }}, {{ $tags.FocalLength }}mm, {{ $tags.ExposureTime }} sec., f/{{ $tags.FNumber }}, ISO {{ $tags.ISO }}"/>
      </section>
    </a>
    <div class="mt-8 mb-2 text-base text-neutral-400 dark:text-neutral-500">
      {{ $exif.Date.Format "2 January 2006" }}&nbsp;&middot;&nbsp;<a href="https://www.google.com/maps/search/{{ .Params.location | urlize }}">{{ .Params.location }}</a>
    </div>
    <div class="mb-12">
      <a href="/photo/"
         class="text-sm text-neutral-500 hover:text-primary-500 dark:text-neutral-400 dark:hover:text-primary-400">
        All photos &rarr;
      </a>
    </div>
  </article>
{{ end }}
      </main>
    </div>
