{{ define "main" }}

<main>
		{{ range first 1 (.Paginate .Pages).Pages }}
		<div class="post">
			{{ if eq .Section "post" }}
			{{ partial "single/post-info.html" . }}
			{{ partial "single/title.html" . }}
			{{ end }}

			{{ .Content }}

		</div>

		{{ end }}
		{{ partial "recently.html" . }}
</main>

{{ end }}
