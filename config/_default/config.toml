baseURL = "https://piotr.is/"
languageCode = "en"
defaultContentLanguage = "en"

title = "Sound & Complete"
copyright = "© 2009—2022 Piotr Kaźmierczak"

enableEmoji = true
enableRobotsTXT = true

summaryLength = 20

