[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  posts = "/:year/:slug/"
  page = "/:filename/"

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = false
    respectDoNotTrack = true
    useSessionStorage = true
  [privacy.youtube]
    disable = false
    privacyEnhanced = true
